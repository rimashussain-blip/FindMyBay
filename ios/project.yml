# XcodeGen spec for the FindMyBay iOS app.
# Run `xcodegen` (in this folder) to (re)generate FindMyBay.xcodeproj.

name: FindMyBay
options:
  bundleIdPrefix: ae.findmybay
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Apple Developer Team ID for "Find My Bay" — needed for automatic
    # signing to resolve the provisioning profile that carries the
    # `com.apple.developer.applesignin` entitlement.
    DEVELOPMENT_TEAM: "42WB7VFUTD"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode 26 splits debug builds into a separate FindMyBay.debug.dylib
    # for faster relink cycles, but the simulator on this Mac fails to
    # ad-hoc sign it ("Trying to load an unsigned library"). Disabling this
    # optimization gives us a single signed binary that loads cleanly.
    ENABLE_DEBUG_DYLIB: NO

# ─── Swift Package Manager dependencies ───────────────────────────────────
# Xcode resolves these automatically on first build (`xcodebuild` runs
# `-resolvePackageDependencies` under the hood). No manual fetch needed.
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "9.0.0"
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.0"

  # Future packages (still commented out, added per-feature):
  # Firebase:
  #   url: https://github.com/firebase/firebase-ios-sdk
  #   from: "11.0.0"
  # Kingfisher:
  #   url: https://github.com/onevcat/Kingfisher
  #   from: "8.0.0"

targets:
  FindMyBay:
    type: application
    platform: iOS
    sources:
      - path: FindMyBay
    resources:
      - path: FindMyBay/Resources/Assets.xcassets
      - path: FindMyBay/Resources/MapStyles
    info:
      path: FindMyBay/App/Info.plist
      properties:
        CFBundleDisplayName: Find My Bay
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "7"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: >
          Find My Bay uses your location to show car-wash bays near you and
          to time the leave-now alert before your booked slot.
        NSLocationAlwaysAndWhenInUseUsageDescription: >
          Find My Bay uses your location to time the leave-now alert before
          your booked slot, even when the app is in the background.
        NSCameraUsageDescription: >
          Find My Bay uses the camera to scan vendor QR codes during check-in.
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iOS Google Sign-In Client ID. From the iOS OAuth client created
        # under the find-my-bay project, restricted to bundle ae.findmybay.debug.
        GIDClientID: 343658146175-5cjbtnqd47gganpa1envveu607tch4hk.apps.googleusercontent.com
        # Server (Web) Client ID. When set, GoogleSignIn returns ID tokens
        # whose `aud` is THIS client ID — matching what the backend's Google
        # verifier is already configured to accept. Keeps the backend audience
        # unified across iOS / Android / Web without per-platform allowlists.
        GIDServerClientID: 343658146175-u7psbhg158ojp2rug0h5a4hmia14i63t.apps.googleusercontent.com
        # Google Maps SDK iOS API key. iOS-restricted (bundle IDs:
        # ae.findmybay.debug + ae.findmybay) with Maps SDK for iOS enabled.
        # Read by GoogleMapsService.configure() at app launch.
        GOOGLE_MAPS_API_KEY: AIzaSyAQJ_qDBj0vtD-IB-sa-cY1r1djiFXJ814
        # OAuth + payment custom URL schemes.
        # The googleusercontent.apps.* scheme is the "reversed Client ID" —
        # Google Sign-In hands off back through it after the user consents.
        CFBundleURLTypes:
          - CFBundleURLName: ae.findmybay.payment
            CFBundleURLSchemes:
              - findmybay
          - CFBundleURLName: ae.findmybay.googleSignIn
            CFBundleURLSchemes:
              - com.googleusercontent.apps.343658146175-5cjbtnqd47gganpa1envveu607tch4hk
    entitlements:
      path: FindMyBay/FindMyBay.entitlements
      properties:
        # Sign in with Apple. Enable the matching capability on App Store
        # Connect / Apple Developer Center for ae.findmybay (release) and
        # ae.findmybay.debug. Required — the entitlement is verified at
        # provisioning time and the request silently fails without it.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.findmybay
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: FindMyBay/FindMyBay.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ae.findmybay.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ae.findmybay
          # Manual signing for App Store archives. Reasons:
          # 1. Automatic signing tries to mint an iOS App Development profile
          #    during the archive build phase. That requires a registered
          #    device, which a fresh paid Apple Developer account doesn't
          #    have — so the archive fails before reaching distribution.
          # 2. Overriding CODE_SIGN_IDENTITY globally via xcodebuild flags
          #    propagates to every Swift Package resource bundle target,
          #    which conflicts with their own automatic-signing setup.
          # Manual signing on JUST the FindMyBay Release config avoids both
          # problems. SPM packages keep their automatic Development signing.
          # The "FindMyBay App Store" profile is generated once at
          # developer.apple.com/account/resources/profiles/add — see the
          # release-testflight.sh header for the steps.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "FindMyBay App Store"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: GoogleMaps
        product: GoogleMaps
      - package: SocketIO
        product: SocketIO

  FindMyBayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FindMyBayTests
    dependencies:
      - target: FindMyBay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.findmybay.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FindMyBay:
    build:
      targets:
        FindMyBay: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FindMyBayTests
    archive:
      config: Release
