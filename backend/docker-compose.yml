# Local dev infrastructure for Find My Bay backend.
# Run:  docker compose up -d
# Stop: docker compose down
# Wipe: docker compose down -v   (deletes the postgres volume)

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: fmb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fmb
      POSTGRES_PASSWORD: fmb_dev
      POSTGRES_DB: findmybay
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fmb -d findmybay']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fmb-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
